# ==============================================================================
# /etc/nginx/sites-available/shop.easyeverything.cn.conf
# 极简惠选商城唯一 Nginx 配置（仅管理 shop 子域名，不触碰主域名 easyeverything.cn）
# 说明：
#   1. 保持 listen 80 部署，随后用 certbot --nginx 一键自动配置 443 HTTPS；
#   2. 勿在顶部放 server_tokens（防止与系统 nginx.conf 冲突），已放在各 server 块内。
# ==============================================================================

# ------------------------------------------------------------------------------
# 公用限流与扫描器特征（位于 http {} 上下文，宽松防扫、免维护）
# ------------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=easyshop_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=easyshop_heavy:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=easyshop_conn:10m;

# 仅在 HTTPS(443) 下开启 HSTS（不含 includeSubDomains，不影响主域名及其他子域名）
map $scheme $easyshop_hsts {
    default "";
    https "max-age=2592000";
}

# 极简恶意扫描器与商业爬站工具黑名单（不拦空 UA、不拦 curl、不误伤微信或正常浏览器）
map $http_user_agent $is_bad_scanner {
    default 0;
    "~*(sqlmap|nikto|nmap|masscan|zgrab|nuclei|scrapy|python-requests|go-http-client|bytespider|semrushbot|ahrefsbot|gptbot|claudebot)" 1;
}

# ------------------------------------------------------------------------------
# 兜底黑洞（拦截直接用服务器 IP 扫描或未绑定域名试探；不影响以后新增其他子域名）
# 部署前记得删掉旧默认软链：rm -f /etc/nginx/sites-enabled/default
# ------------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    server_tokens off;
    ssl_reject_handshake on;
}

# ------------------------------------------------------------------------------
# 商城短域名自动规范跳转到 https://www.shop.easyeverything.cn
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name shop.easyeverything.cn;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://www.shop.easyeverything.cn$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 商城正式主入口：www.shop.easyeverything.cn -> 127.0.0.1:8001
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name www.shop.easyeverything.cn;

    server_tokens off;
    client_max_body_size 15m;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn easyshop_conn 30;

    # 统一反向代理公共参数（由各 location 继承，避免多处重复配置）
    proxy_http_version 1.1;
    proxy_read_timeout 90s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    if ($request_method !~ ^(GET|POST|HEAD|OPTIONS)$) {
        return 405;
    }

    # 拦截黑产扫描器与商业爬虫（豁免 Certbot 续期校验与本机自检）
    set $block_bot 0;
    if ($is_bad_scanner = 1) {
        set $block_bot 1;
    }
    if ($uri ~* "^/\.well-known/acme-challenge/") {
        set $block_bot 0;
    }
    if ($remote_addr = "127.0.0.1") {
        set $block_bot 0;
    }
    if ($block_bot = 1) {
        return 444;
    }

    # 限流触发 429 时返回前端可读 JSON
    location @rate_limited_json {
        default_type application/json;
        return 429 '{"status":"error","error_code":"rate_limited","error_msg":"操作过于频繁，请稍后再试"}';
    }

    # 1. Let's Encrypt 证书自动续期校验
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 2. 拒绝搜索引擎爬虫收录商城页
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # 3. 内部上游健康面板仅允许服务器本机访问
    location = /api/system/upstream-health {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8001;
    }

    # 4. 屏蔽接口文档与常见后台/配置探针
    location ~* ^/(docs|redoc|openapi\.json) {
        return 404;
    }
    location ~ /\.(?!well-known) {
        return 444;
    }
    location ~* \.(php|asp|aspx|jsp|env|git|sql|bak)$ {
        return 444;
    }

    # 5. 静态资源协商缓存（避免发版后旧 JS 配新 HTML 白屏）
    location ^~ /static/ {
        proxy_pass http://127.0.0.1:8001;
        add_header Cache-Control "public, no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security $easyshop_hsts always;
    }

    # 6a. 高消耗写操作与上游配额敏感接口（登录校验、转链、传图/口令发团）收紧至 2r/s
    location ~ ^/api/(user/register_or_login|promote/(convert|universal)|group_help/(upload|submit_text))$ {
        limit_req zone=easyshop_heavy burst=6 nodelay;
        error_page 429 = @rate_limited_json;
        proxy_pass http://127.0.0.1:8001;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security $easyshop_hsts always;
    }

    # 6b. 其他普通业务 API（公用宽松限流，后续加减接口无需改 Nginx）
    location /api/ {
        limit_req zone=easyshop_api burst=30 nodelay;
        error_page 429 = @rate_limited_json;
        proxy_pass http://127.0.0.1:8001;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security $easyshop_hsts always;
    }

    # 7. 动态页面入口（/、/detail、/group_help、/health 等）
    location / {
        proxy_pass http://127.0.0.1:8001;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security $easyshop_hsts always;
    }
}

# 说明：以后要在同一台服务器新增主域名或其他子域名（如 xxx.easyeverything.cn）服务，
# 只需在 /etc/nginx/sites-available/ 下新建另一个 .conf 文件并启用即可，彼此完全独立、互不冲突。
