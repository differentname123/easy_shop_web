<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="theme-color" content="#e02e24">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="查券省钱">
  <title>好价爆料中心 - 查券省钱</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png?v=20261111-1">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png?v=20261111-1">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/static/css/style.css?v=ux-20261127-1">
  <link rel="stylesheet" href="/static/css/detail.css?v=ux-20261127-1">
  <script src="/static/js/vue.global.prod.js?v=ux-20261127-1"></script>
  <style>
    .submit-deal-page { padding-top: calc(48px + var(--safe-top)); padding-bottom: 36px; min-height: 100vh; background: var(--bg-page); max-width: 540px; margin: 0 auto; }
    .submit-anchor-card { display: flex; gap: 10px; align-items: center; }
    .submit-anchor-thumb { width: 72px; height: 72px; border-radius: 8px; object-fit: cover; flex-shrink: 0; background: #f5f5f5; border: 1px solid #f0f0f0; }
    .submit-anchor-meta { flex: 1; min-width: 0; }
    .submit-anchor-title { font-size: 13px; font-weight: 600; color: var(--text-main); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .submit-anchor-price { margin-top: 6px; font-size: 12px; color: var(--text-sub); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .submit-anchor-ref-num { color: var(--primary-color); font-weight: 700; font-size: 14px; }
    .submit-lock-tag { font-size: 10px; background: #f3f4f6; color: #6b7280; padding: 1px 6px; border-radius: 4px; }
    .submit-field { margin-bottom: 14px; }
    .submit-label { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; color: var(--text-main); margin-bottom: 6px; }
    .submit-counter { font-size: 11px; font-weight: 400; color: var(--text-muted); }
    .submit-input, .submit-textarea { width: 100%; box-sizing: border-box; border: 1px solid #e5e7eb; border-radius: 10px; padding: 10px 12px; font-size: 14px; color: var(--text-main); background: #fafafa; outline: none; font-family: inherit; }
    .submit-input:focus, .submit-textarea:focus { border-color: var(--primary-color); background: #ffffff; }
    .submit-textarea { min-height: 104px; resize: vertical; line-height: 1.55; }
    .submit-help-note { font-size: 11px; color: var(--text-muted); line-height: 1.5; margin-top: 5px; }
    .submit-img-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
    .submit-img-item { position: relative; width: 76px; height: 76px; border-radius: 10px; overflow: hidden; border: 1px solid #e5e7eb; background: #f9fafb; }
    .submit-img-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .submit-img-del { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; border: none; background: rgba(0, 0, 0, 0.58); color: #fff; font-size: 13px; line-height: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .submit-img-add { width: 76px; height: 76px; border-radius: 10px; border: 1.5px dashed #d9d9d9; background: #fafafa; color: var(--text-sub); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; cursor: pointer; }
    .submit-btn-main { width: 100%; border: none; border-radius: 22px; padding: 11px 16px; font-size: 14px; font-weight: 700; color: #fff; background: linear-gradient(135deg, #ff4d4f 0%, #cf1322 100%); box-shadow: 0 4px 12px rgba(207, 19, 34, 0.28); cursor: pointer; }
    .submit-btn-main:disabled { opacity: 0.55; cursor: not-allowed; box-shadow: none; }
    .submit-record-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .submit-record-title { font-size: 14px; font-weight: 700; color: var(--text-main); }
    .submit-refresh-btn { font-size: 12px; color: var(--primary-color); background: #fff1f0; border: 1px solid #ffccc7; border-radius: 12px; padding: 3px 10px; cursor: pointer; }
    .submit-record-item { padding: 10px 0; border-top: 1px solid #f2f2f2; }
    .submit-record-item:first-child { border-top: none; padding-top: 2px; }
    .submit-record-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .submit-record-name { font-size: 13px; font-weight: 600; color: var(--text-main); line-height: 1.4; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .submit-state-badge { flex-shrink: 0; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; }
    .submit-state-badge.pending { background: #fff7e6; color: #d46b08; border: 1px solid #ffd591; }
    .submit-state-badge.published { background: #f6ffed; color: #389e0d; border: 1px solid #b7eb8f; }
    .submit-state-badge.duplicate { background: #e6f7ff; color: #096dd9; border: 1px solid #91d5ff; }
    .submit-state-badge.rejected { background: #fff1f0; color: #cf1322; border: 1px solid #ffa39e; }
    .submit-record-sub { margin-top: 5px; font-size: 12px; color: var(--text-sub); line-height: 1.45; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .submit-jump-link { color: var(--primary-color); font-weight: 600; flex-shrink: 0; cursor: pointer; white-space: nowrap; }
    .submit-empty-center { text-align: center; padding: 36px 20px; color: var(--text-sub); font-size: 13px; line-height: 1.6; }
    .submit-mode-tip { font-size: 12px; color: #595959; background: #fff7f5; border: 1px solid #ffe4de; line-height: 1.5; }
    .submit-reward-banner { display: flex; align-items: flex-start; gap: 8px; background: linear-gradient(135deg, #fff9ec 0%, #fff2dc 100%); border: 1px solid #ffdca3; font-size: 12px; color: #7a4100; line-height: 1.55; }
    .submit-reward-icon { font-size: 17px; line-height: 1.3; flex-shrink: 0; }
    .submit-reward-text { flex: 1; min-width: 0; }
    .submit-privacy-tip { color: #ad4e00; font-weight: 600; }
    .submit-commission-pill { font-size: 10px; font-weight: 700; color: #b45309; background: #fffbeb; border: 1px solid #fde68a; padding: 1px 6px; border-radius: 4px; }
    .submit-summary-box { background: linear-gradient(135deg, #fffdf7 0%, #fff7e6 100%); border: 1px solid #ffe2a8; border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
    .submit-summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
    .submit-summary-val { font-size: 16px; font-weight: 800; color: #cf1322; line-height: 1.25; }
    .submit-summary-val.settled { color: #389e0d; }
    .submit-summary-val.muted { color: #595959; }
    .submit-summary-lbl { font-size: 11px; color: #8c6d3f; margin-top: 2px; }
    .submit-summary-note { margin-top: 8px; padding-top: 7px; border-top: 1px dashed #f3d79b; font-size: 11px; color: #7a5c2e; line-height: 1.45; }
    .submit-attr-panel { margin-top: 7px; background: #fafafa; border: 1px solid #f0f0f0; border-radius: 8px; padding: 7px 10px; font-size: 11px; color: #595959; line-height: 1.5; }
    .submit-attr-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; }
    .submit-alive-tag { font-weight: 700; color: #d46b08; }
    .submit-alive-tag.active { color: #389e0d; }
    .submit-attr-metrics { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .submit-attr-money { color: #cf1322; font-weight: 700; }
    .submit-orders-btn { border: 1px solid #ffd591; background: #fff7e6; color: #d46b08; border-radius: 10px; padding: 1px 8px; font-size: 11px; cursor: pointer; margin-left: auto; }
    .submit-orders-list { margin-top: 6px; padding-top: 6px; border-top: 1px dashed #e5e7eb; display: flex; flex-direction: column; gap: 5px; }
    .submit-order-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11px; color: #595959; }
    .submit-order-sn { color: #8c8c8c; font-family: monospace; }
    .submit-order-comm { font-weight: 700; color: #cf1322; white-space: nowrap; }
    .submit-order-comm.after-sale { color: #d46b08; }
  </style>
</head>
<body>
<div id="app" class="submit-deal-page" v-cloak>
  <header class="detail-nav-bar">
    <button class="detail-nav-btn" @click="goBack">
      <svg style="width:20px;height:20px;fill:currentColor" viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      <span>返回</span>
    </button>
    <span class="detail-nav-title">{{ hasAnchorParams ? '爆料最新好价' : '我的爆料记录' }}</span>
    <button class="detail-nav-btn" @click="goHome">
      <span>首页</span>
    </button>
  </header>

  <div class="detail-card-section submit-empty-center" v-if="!checkingAuth && !isLoggedIn">
    <div style="margin-bottom:14px;">登录后即可提交好价爆料，采纳展示期间他人跟买可享丰厚佣金奖励</div>
    <button class="submit-btn-main" style="max-width:200px;margin:0 auto;" @click="goToLogin">去登录</button>
  </div>

  <template v-else-if="!checkingAuth">
    <div class="detail-card-section submit-mode-tip" v-if="!hasAnchorParams">
      💡 进入任意商品详情页点「✍️ 爆料最新价」即可提交攻略：审查采纳后的有效展示期间（72小时），其他拼友看到你的爆料并下单，你将获得丰厚佣金奖励！
    </div>

    <template v-else>
      <div class="detail-card-section submit-empty-center" v-if="loadingGoods && !goods">
        正在核验商品信息...
      </div>

      <div class="detail-card-section submit-empty-center" v-else-if="goodsError">
        <div style="margin-bottom:12px;">{{ goodsError }}</div>
        <button type="button" class="submit-refresh-btn" @click="goBack">返回上一页</button>
      </div>

      <template v-else-if="goods">
        <div class="detail-card-section">
          <div class="submit-anchor-card">
            <img :src="goods.image_url || '/static/icons/icon-192.png?v=20261111-1'" class="submit-anchor-thumb" referrerpolicy="no-referrer" :alt="goods.name" />
            <div class="submit-anchor-meta">
              <div class="submit-anchor-title">
                <span class="plat-badge" :class="goods.platform" style="position:static;margin-right:4px;font-size:10px">{{ goods.platform_name || goods.platform }}</span>
                {{ goods.name }}
              </div>
              <div class="submit-anchor-price">
                <span>当前参考价</span>
                <span class="submit-anchor-ref-num">¥{{ formatMoney(goods.price) }}</span>
                <span class="submit-commission-pill" v-if="Number(goods.commission_amount) > 0" role="button" tabindex="0" style="cursor:pointer" @click="openCommissionHelp">佣金 ¥{{ formatMoney(goods.commission_amount) }} ?</span>
                <span class="submit-lock-tag">已实名锁定主商品</span>
              </div>
            </div>
          </div>
        </div>

        <div class="detail-card-section submit-reward-banner">
          <span class="submit-reward-icon">💰</span>
          <div class="submit-reward-text">
            <strong>爆料采纳赚高额佣金：</strong>你的爆料通过审查上架后，有效展示期间（72小时内）只要其他拼友看到你的攻略并购买该商品，你就能获得丰厚佣金奖励！价格越真实、步骤越清晰越稳赚。<br>
            <span style="color:#ad4e00;">审核与打款提示：提交前将先经人工审查，最终打款时还会对历史爆料与替换行为进行人工二次复审；严禁盗用他人截图、P图造假、虚报低价或恶意覆盖他人好价，违者将取消相关佣金并处罚账号。</span>
          </div>
        </div>

        <form class="detail-card-section" @submit.prevent="handleSubmit">
          <div class="submit-field">
            <label class="submit-label">
              <span>实际到手价（元）</span>
            </label>
            <input
              v-model="dealPrice"
              type="number"
              step="0.01"
              min="0.01"
              max="999999"
              class="submit-input"
              placeholder="例如：29.9（拍多件请填实付总价并在下方写明件数）"
              required
            />
          </div>

          <div class="submit-field">
            <label class="submit-label">
              <span>购买步骤 / 优惠玩法说明</span>
              <span class="submit-counter">{{ tutorialText.trim().length }} / 800</span>
            </label>
            <textarea
              v-model="tutorialText"
              maxlength="800"
              class="submit-textarea"
              placeholder="请写清购买步骤或当前最新优惠方式（如领券位置、满减凑单或实际买法）"
              required
            ></textarea>
          </div>

          <div class="submit-field">
            <label class="submit-label">
              <span>价格证明截图（必填，1~3 张）</span>
              <span class="submit-counter">{{ selectedImages.length }} / 3</span>
            </label>
            <input
              ref="imageInputRef"
              type="file"
              accept="image/png,image/jpeg,image/webp,image/jpg"
              multiple
              style="display:none"
              @change="onSelectImages"
            />
            <div class="submit-img-grid">
              <div class="submit-img-item" v-for="(img, idx) in selectedImages" :key="img.id">
                <img :src="img.preview" alt="爆料凭证截图" />
                <button type="button" class="submit-img-del" @click="removeImage(idx)" aria-label="删除图片">×</button>
              </div>
              <button type="button" class="submit-img-add" v-if="selectedImages.length < 3" :disabled="compressingImages" @click="triggerImagePicker">
                <span style="font-size:20px;line-height:1;">{{ compressingImages ? '⏳' : '+' }}</span>
                <span>{{ compressingImages ? '压缩中' : '传截图' }}</span>
              </button>
            </div>
            <div class="submit-help-note">只需上传 1 张能看到当前实际到手价的截图即可（如结算页、购物车优惠预览、领券弹窗或已付订单页，无需真实付款也能提交）。<span class="submit-privacy-tip">⚠️ 温馨提示：截图将随攻略公开展示，上传前请自行裁切或打码隐藏收货地址、手机号、姓名等个人隐私信息。</span>提交后将进入人工审查。</div>
          </div>

          <div class="submit-field">
            <label class="submit-label">
              <span>额外领券链接 / 口令（选填）</span>
            </label>
            <input
              v-model="couponInput"
              type="text"
              maxlength="512"
              class="submit-input"
              placeholder="选填：粘贴领券链接或口令（系统自动核验转链）"
            />
          </div>

          <div class="submit-help-note" style="margin-bottom:10px;color:#8c6d3f;">
            ⚠️ 诚信提示：提交将先经人工审查，且最终打款前会再次人工复核历史爆料与替换记录；若存在盗图造假或恶意覆盖等违规行为，必将取消佣金并处罚账号。
          </div>
          <div v-if="quotaNotice" style="margin-bottom:10px;padding:9px 12px;background:#fff7e6;border:1px solid #ffd591;border-radius:10px;font-size:12px;color:#7a4100;display:flex;align-items:center;justify-content:space-between;gap:10px;">
            <span style="flex:1;line-height:1.45;">{{ quotaNotice.message }}</span>
            <button type="button" v-if="quotaNotice.needAuth" class="submit-refresh-btn" style="flex-shrink:0;" @click="goToAuth">去完成授权</button>
          </div>
          <button type="submit" class="submit-btn-main" :disabled="submitting || compressingImages">
            {{ submitting ? '正在提交审查...' : '提交人工审查' }}
          </button>
        </form>
      </template>
    </template>

    <div class="detail-card-section">
      <div class="submit-record-header">
        <span class="submit-record-title">我的最近爆料 ({{ submissions.length }})</span>
        <div style="display:flex;align-items:center;gap:6px;">
          <button type="button" class="commission-help-link" style="margin-left:0;" @click="openCommissionHelp">佣金说明 ?</button>
          <button type="button" class="submit-refresh-btn" :disabled="loadingSubmissions" @click="loadSubmissions">
            {{ loadingSubmissions ? '刷新中...' : '刷新进度 ↻' }}
          </button>
        </div>
      </div>
      <div class="submit-summary-box" v-if="dealSummary.displayed_count > 0 || dealSummary.valid_order_count > 0">
        <div class="submit-summary-grid">
          <div>
            <div class="submit-summary-val">¥{{ formatMoney(dealSummary.estimated_commission_yuan) }}</div>
            <div class="submit-summary-lbl">爆料佣金 ({{ dealSummary.valid_order_count }}单)</div>
          </div>
          <div>
            <div class="submit-summary-val settled">¥{{ formatMoney(dealSummary.settled_commission_yuan) }}</div>
            <div class="submit-summary-lbl">已结算佣金 ({{ dealSummary.settled_order_count }}单)</div>
          </div>
          <div>
            <div class="submit-summary-val muted">{{ dealSummary.excluded_refund_invalid_count }} / {{ dealSummary.excluded_channel_count }}</div>
            <div class="submit-summary-lbl">剔除退失效 / 渠道单</div>
          </div>
        </div>
        <div class="submit-summary-note">
          归因与风控说明：仅统计爆料展示期间经站长默认链接成交的有效订单，已自动排除退款、失效、未付款及他人自购/个人推广渠道单（<span v-if="dealSummary.after_sale_order_count > 0">另有 {{ dealSummary.after_sale_order_count }} 笔售后核验中暂未计入，</span>最终金额以平台结算为准；最终打款前将对历史爆料与替换行为进行人工再次审查，如有盗图造假或恶意覆盖等恶意行为将取消佣金并处罚账号）。
        </div>
      </div>
      <div v-if="loadingSubmissions && submissions.length === 0" class="submit-help-note">正在加载记录...</div>
      <div v-else-if="submissions.length === 0" class="submit-empty-center" style="padding:20px 10px;">
        <div>还没有爆料记录，去商品详情页点「✍️ 爆料最新价」分享最新真实到手价和买法吧</div>
      </div>
      <div v-else>
        <div class="submit-record-item" v-for="rec in submissions" :key="rec.tip_id">
          <div class="submit-record-top">
            <span class="submit-record-name">
              <span v-if="rec.deal_price !== null && rec.deal_price !== undefined" style="color:var(--primary-color);margin-right:4px;">¥{{ formatMoney(rec.deal_price) }}</span>
              <span v-if="rec.image_count > 0" style="font-size:11px;color:#8c8c8c;margin-right:4px;">[{{ rec.image_count }}图]</span>
              {{ rec.title || '好价爆料' }}
            </span>
            <span class="submit-state-badge" :class="rec.state">{{ rec.state_label }}</span>
          </div>
          <div class="submit-record-sub">
            <span>{{ rec.reason }}</span>
            <span
              class="submit-jump-link"
              v-if="rec.item_code"
              @click="openSubmittedDetail(rec)"
            >查看商品 ›</span>
          </div>
          <div class="submit-attr-panel" v-if="rec.display_started_at && rec.commission_stats">
            <div class="submit-attr-top">
              <span class="submit-alive-tag" :class="{ active: rec.display_status === 'active' }">
                {{ rec.display_status === 'active' ? '展示中' : (rec.display_status === 'replaced' ? '已被替代下线' : '已过期下线') }}
                · 存活 {{ rec.display_duration_text || '不足1分钟' }}
              </span>
              <span v-if="rec.display_started_str">
                {{ rec.display_started_str }} ~ {{ rec.display_status === 'active' ? '至今' : (rec.display_ended_str || '') }}
              </span>
            </div>
            <div class="submit-attr-metrics">
              <span>有效 {{ rec.commission_stats.valid_order_count }} 笔</span>
              <span class="submit-attr-money">佣金 ¥{{ formatMoney(rec.commission_stats.estimated_commission_yuan) }}</span>
              <span>已结算 ¥{{ formatMoney(rec.commission_stats.settled_commission_yuan) }}</span>
              <span v-if="rec.commission_stats.after_sale_order_count > 0" style="color:#d46b08;">售后中 {{ rec.commission_stats.after_sale_order_count }} 笔</span>
              <span v-if="rec.commission_stats.excluded_refund_invalid_count > 0">已剔除退款/失效 {{ rec.commission_stats.excluded_refund_invalid_count }} 笔</span>
              <span v-if="rec.commission_stats.excluded_channel_count > 0">已剔除渠道单 {{ rec.commission_stats.excluded_channel_count }} 笔</span>
              <button
                type="button"
                class="submit-orders-btn"
                v-if="rec.commission_stats.recent_orders && rec.commission_stats.recent_orders.length > 0"
                @click="toggleRecordOrders(rec.tip_id)"
              >{{ expandedOrdersMap[rec.tip_id] ? '收起明细 ▲' : ('订单明细 (' + rec.commission_stats.recent_orders.length + ') ▼') }}</button>
            </div>
            <div v-if="rec.commission_stats.jd_sku_unmapped" style="margin-top:3px;color:#8c8c8c;">
              该商品暂缺主图指纹或数字 SKU 映射，等待商品详情补全后即可匹配京东订单
            </div>
            <div class="submit-orders-list" v-if="expandedOrdersMap[rec.tip_id] && rec.commission_stats.recent_orders && rec.commission_stats.recent_orders.length">
              <div class="submit-order-row" v-for="(ord, oIdx) in rec.commission_stats.recent_orders" :key="(ord.order_sn || oIdx) + '_' + oIdx">
                <span>
                  <span class="submit-order-sn">{{ ord.order_sn }}</span>
                  <span style="margin-left:5px;">{{ ord.order_time_str }}</span>
                  <span style="margin-left:5px;">{{ ord.order_status_desc }}</span>
                </span>
                <span class="submit-order-comm" :class="{ 'after-sale': ord.bucket === 'after_sale' }">
                  {{ ord.bucket === 'after_sale' ? '售后待定 ' : '' }}¥{{ formatMoney(ord.commission_yuan) }}
                </span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </template>

  <div class="site-icp-footer">
    <span>成都东部新区便易屋信息技术咨询经营部</span>
    <span class="icp-sep">·</span>
    <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">蜀ICP备2026073570号-1</a>
  </div>

  <div class="modal-backdrop" v-if="isCommissionHelpOpen" @click.self="closeCommissionHelp">
    <div class="sheet-dialog">
      <div class="sheet-header">
        <span>佣金结算与常见问题</span>
        <button type="button" class="sheet-close" aria-label="关闭" @click="closeCommissionHelp">×</button>
      </div>
      <div class="sheet-scroll-body">
        <div class="faq-section" v-for="(sec, sIdx) in commissionFaqSections" :key="sIdx">
          <div class="faq-title">{{ sec.title }}</div>
          <ul class="faq-list">
            <li v-for="(item, iIdx) in sec.items" :key="iIdx">{{ item }}</li>
          </ul>
        </div>
        <p class="faq-footnote">商品展示佣金仅供参考，订单佣金与最终金额以平台结算为准；平台已结算佣金不代表可提现余额，本页面不提供提现或资金账本。</p>
      </div>
      <div class="pop-action-btns" style="margin-top:10px;flex-shrink:0;">
        <button type="button" class="btn-primary-block" @click="closeCommissionHelp">我知道了</button>
      </div>
    </div>
  </div>

  <div class="toast-box" v-if="toastMessage">{{ toastMessage }}</div>
</div>
